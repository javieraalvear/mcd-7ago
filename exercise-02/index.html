<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silueta de partículas · Rosenberg Self-Esteem Scale</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="lienzo"></canvas>

  <p class="hud hud-superior-izq">COMPUTACIÓN AVANZADA · MCD UAI<br />RSE · SILUETA DE PARTÍCULAS</p>

  <p id="indicador" class="hud hud-superior-der">—</p>

  <div class="hud hud-inferior-izq controles">
    <button id="reproducir">Pausar</button>

    <label class="control-slider">
      <span>EDAD <output id="valor-edad">25</output></span>
      <input id="control-edad" type="range" min="5" max="90" value="25" />
    </label>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
