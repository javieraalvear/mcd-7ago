<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti Gestual</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d0d0c;
    color: #ede9df;
    font-family: "IBM Plex Mono", monospace;
    overflow: hidden;
  }

  #ui {
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    width: 250px;
    max-height: calc(100vh - 2.4rem);
    overflow-y: auto;
    padding: 1rem;
    background: rgba(20, 20, 18, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(237, 233, 223, 0.12);
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  h1 {
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 0.4rem;
  }

  .status {
    font-size: 0.7rem;
    color: #8a8478;
    min-height: 1.8em;
    line-height: 1.3;
  }
  .status strong { color: #c81e1e; }

  button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #1a1a1a;
    color: #ede9df;
    border: 1px solid #3a3a38;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
  }
  button:hover { border-color: #c81e1e; }

  .section {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding-top: 0.4rem;
    border-top: 1px solid #262624;
  }

  .label {
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8478;
  }

  input[type="range"] {
    width: 180px;
    accent-color: #c81e1e;
  }

  .brushes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .brushBtn, .sceneBtn {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: #1a1a1a;
    color: #ede9df;
    border: 1px solid #3a3a38;
    padding: 0.35rem 0.6rem;
    cursor: pointer;
  }
  .brushBtn.active, .sceneBtn.active { border-color: #c81e1e; color: #c81e1e; }

  .hint {
    font-size: 0.62rem;
    color: #6b6558;
    margin: -0.35rem 0 0;
  }

  .colorWheelWrap {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.3rem;
  }
  #colorWheel {
    border-radius: 50%;
    cursor: crosshair;
    border: 1px solid #3a3a38;
  }
  .currentColor {
    width: 28px;
    height: 28px;
    border: 1px solid #3a3a38;
    flex-shrink: 0;
  }

  #camPreview {
    position: fixed;
    bottom: 1.2rem;
    right: 1.2rem;
    z-index: 10;
    width: 200px;
    border: 1px solid #3a3a38;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>Graffiti gestual</h1>
  <p class="hint">Mano derecha: pinta · Mano izquierda: color</p>
  <p class="status" id="statusText">Buscando manos<strong>...</strong></p>

  <div class="section">
    <label class="label">Escenario</label>
    <div class="brushes" id="scenes"></div>
  </div>

  <div class="section">
    <label class="label">Pincel</label>
    <div class="brushes" id="brushes"></div>
  </div>

  <div class="section">
    <label class="label">Grosor boquilla <span id="nozzleVal">1.0x</span></label>
    <input type="range" id="nozzleSlider" min="0.3" max="2.5" step="0.1" value="1">
  </div>

  <div class="section">
    <label class="label">Color</label>
    <div class="colorWheelWrap">
      <canvas id="colorWheel" width="120" height="120"></canvas>
      <div class="currentColor" id="currentColorSwatch"></div>
    </div>
  </div>

  <div class="section">
    <button id="pauseBtn">Pausar</button>
    <button id="clearBtn">Limpiar muro</button>
    <button id="saveBtn">Guardar PNG</button>
  </div>
</div>

<script>
/* ============================================================
   PIPELINE: cámara -> ml5 handPose -> landmarks -> parámetros
   El "muro" (wall) es un graphics buffer que NUNCA se limpia
   entre frames, por eso la pintura se acumula. Cuando conectes
   un sensor de movimiento a futuro, solo reemplazas la función
   getSprayParams() por una que lea ese sensor: el resto del
   sistema (muro, spray, paleta) no cambia.
   ============================================================ */

let handPose;
let video;
let hands = [];
let wall; // buffer persistente = el muro

/* Umbrales con histéresis para el gesto de pellizco: hace falta pellizcar
   fuerte para EMPEZAR a rociar, pero hay que abrir bastante la mano para
   DEJAR de rociar. Ese margen evita que el ruido del tracking (temblor de
   la mano, jitter del modelo) rompa el pellizco cuadro a cuadro mientras
   ajustas el grosor con la apertura de la mano. */
const PINCH_START = 42;
const PINCH_STOP = 60;

// suavizado exponencial (0 = muy suave/lento, 1 = sin suavizado)
const POS_SMOOTHING = 0.35;
const RADIUS_SMOOTHING = 0.15;
const PINCH_SMOOTHING = 0.25;
const WHEEL_SMOOTHING = 0.25;

let currentColor = "#c81e1e";

let nozzleScale = 1; // multiplicador manual sobre el radio calculado por gesto

// último punto pintado, para que "marcador" pueda trazar líneas continuas
let prevX = 0, prevY = 0, isSprayingPrev = false;

// estado suavizado de cada mano; se resetea a null cuando la mano desaparece
// para que no "arrastre" una línea al reaparecer en otro lugar
let rightState = null; // { x, y, radius, pinchDist, spraying }
let leftState = null;  // { cx, cy, px, py }

let isPaused = false; // congela el resultado sin perder lo pintado

let colorWheelGfx; // rueda cromática precalculada, reutilizada en el panel y sobre la mano izquierda
const COLOR_WHEEL_SIZE = 160;

const scenes = {
  pared: { label: "Pared" },
  pizarra: { label: "Pizarra" },
  ladrillo: { label: "Ladrillo" },
  camara: { label: "Mi cámara" }
};
let currentScene = "pared";
let sceneBuffers = {}; // fondos estáticos precalculados (todo menos "camara")

const brushes = {
  spray: {
    label: "Spray",
    draw(x, y, radius, hex) {
      const c = color(hex);
      wall.noStroke();
      const density = Math.round(10 * nozzleScale);
      for (let i = 0; i < density; i++) {
        const a = random(TWO_PI);
        const r = random(radius);
        const px = x + cos(a) * r;
        const py = y + sin(a) * r;
        wall.fill(red(c), green(c), blue(c), random(15, 45));
        wall.circle(px, py, random(2, 5) * nozzleScale);
      }
    }
  },
  marcador: {
    label: "Marcador",
    draw(x, y, radius, hex, prev) {
      wall.stroke(color(hex));
      wall.strokeWeight(radius * 0.9);
      wall.strokeCap(ROUND);
      wall.line(prev.x, prev.y, x, y);
    }
  },
  goteo: {
    label: "Goteo",
    draw(x, y, radius, hex, prev) {
      brushes.spray.draw(x, y, radius, hex, prev);
      if (random() < 0.06) {
        const c = color(hex);
        wall.noFill();
        wall.stroke(red(c), green(c), blue(c), 120);
        wall.strokeWeight(random(1, 2.5));
        wall.line(x, y, x + random(-3, 3), y + random(20, 80));
      }
    }
  },
  tiza: {
    label: "Tiza",
    draw(x, y, radius, hex) {
      const c = color(hex);
      wall.noStroke();
      const density = Math.round(18 * nozzleScale);
      for (let i = 0; i < density; i++) {
        const a = random(TWO_PI);
        const r = random(radius);
        const px = x + cos(a) * r;
        const py = y + sin(a) * r;
        wall.fill(red(c), green(c), blue(c), random(30, 70));
        wall.circle(px, py, random(1, 3));
      }
    }
  }
};
let currentBrush = "spray";

function preload() {
  handPose = ml5.handPose({ flipped: true }); // flipped: coincide con el mirror del canvas
}

function setup() {
  const canvas = createCanvas(windowWidth, windowHeight);
  canvas.style("display", "block");

  wall = createGraphics(windowWidth, windowHeight);
  wall.clear(); // el muro empieza transparente: se ve el escenario detrás

  buildSceneBuffers();

  video = createCapture(VIDEO);
  video.size(320, 240);
  video.hide();

  handPose.detectStart(video, (results) => { hands = results; });

  colorWheelGfx = buildColorWheelGraphic(COLOR_WHEEL_SIZE);
  setCurrentColor(currentColor);

  buildBrushes();
  buildSceneButtons();
  buildColorWheelPanel();
  select("#clearBtn").mousePressed(() => wall.clear());
  select("#saveBtn").mousePressed(saveArtwork);
  select("#pauseBtn").mousePressed(togglePause);
  select("#nozzleSlider").input(() => {
    nozzleScale = float(select("#nozzleSlider").value());
    select("#nozzleVal").html(nozzleScale.toFixed(1) + "x");
  });
}

function draw() {
  drawSceneBackground();
  image(wall, 0, 0); // dibuja la pintura acumulada sobre el escenario

  drawCameraPreview();

  const rightHand = hands.find(h => h.handedness === "Right");
  const leftHand = hands.find(h => h.handedness === "Left");

  if (rightHand) {
    const params = getSprayParams(rightHand);
    if (!isPaused) {
      if (params.spraying) {
        // si recién empezó el gesto, no traza línea desde el punto anterior
        const prev = isSprayingPrev ? { x: prevX, y: prevY } : { x: params.x, y: params.y };
        brushes[currentBrush].draw(params.x, params.y, params.radius, currentColor, prev);
        prevX = params.x;
        prevY = params.y;
      }
      isSprayingPrev = params.spraying;
    }
    drawNozzleCursor({ ...params, spraying: params.spraying && !isPaused });
  } else {
    rightState = null;
    isSprayingPrev = false;
  }

  if (leftHand) {
    updateColorWheelFromHand(leftHand);
  } else {
    leftState = null;
  }

  updateStatusText(rightHand, leftHand);
}

function togglePause() {
  isPaused = !isPaused;
  select("#pauseBtn").html(isPaused ? "Reanudar" : "Pausar");
}

/* --------------------------------------------------------
   Traduce los 21 landmarks de la mano derecha a los parámetros
   que el sistema de spray necesita, suavizando cuadro a cuadro
   para que el trazo sea fluido y no tiemble con el ruido del
   tracking. Este es el punto exacto que reemplazarías si el
   input pasa a ser un sensor de movimiento.
   -------------------------------------------------------- */
function getSprayParams(hand) {
  const kp = (name) => hand.keypoints.find(p => p.name === name);

  const indexTip = kp("index_finger_tip");
  const thumbTip = kp("thumb_tip");
  const wrist = kp("wrist");
  const middleTip = kp("middle_finger_tip");

  const rawPinch = dist(indexTip.x, indexTip.y, thumbTip.x, thumbTip.y);
  const openness = dist(wrist.x, wrist.y, middleTip.x, middleTip.y);

  // mapea coords del video (320x240) al tamaño real del canvas
  const rawX = map(indexTip.x, 0, video.width, 0, width);
  const rawY = map(indexTip.y, 0, video.height, 0, height);
  const rawRadius = map(openness, 60, 200, 8, 55, true) * nozzleScale;

  if (!rightState) {
    // primer cuadro tras aparecer la mano: arranca en el valor real, sin arrastre
    rightState = { x: rawX, y: rawY, radius: rawRadius, pinchDist: rawPinch, spraying: false };
  }

  rightState.x = lerp(rightState.x, rawX, POS_SMOOTHING);
  rightState.y = lerp(rightState.y, rawY, POS_SMOOTHING);
  rightState.radius = lerp(rightState.radius, rawRadius, RADIUS_SMOOTHING);
  rightState.pinchDist = lerp(rightState.pinchDist, rawPinch, PINCH_SMOOTHING);

  if (!rightState.spraying && rightState.pinchDist < PINCH_START) rightState.spraying = true;
  else if (rightState.spraying && rightState.pinchDist > PINCH_STOP) rightState.spraying = false;

  return {
    x: rightState.x, y: rightState.y, radius: rightState.radius,
    spraying: rightState.spraying
  };
}

function drawNozzleCursor(params) {
  push();
  noFill();
  stroke(params.spraying ? "#c81e1e" : "#8a8478");
  strokeWeight(1.5);
  circle(params.x, params.y, params.radius * 2);
  pop();
}

function drawCameraPreview() {
  push();
  translate(width - 10, 10);
  const w = 200, h = 150;
  translate(-w, 0);
  scale(-1, 1); // efecto espejo, sin esto se siente invertido al pintar
  image(video, -w, 0, w, h);
  pop();
}

function drawSceneBackground() {
  if (currentScene === "camara") {
    push();
    translate(width, 0);
    scale(-1, 1); // mismo espejo que el resto del sistema
    image(video, 0, 0, width, height);
    pop();
  } else {
    image(sceneBuffers[currentScene], 0, 0);
  }
}

function buildSceneBuffers() {
  sceneBuffers.pared = createGraphics(width, height);
  sceneBuffers.pared.background(20, 20, 18);

  sceneBuffers.pizarra = createGraphics(width, height);
  sceneBuffers.pizarra.background(26, 46, 36);
  sceneBuffers.pizarra.noFill();
  sceneBuffers.pizarra.stroke(70, 45, 25);
  sceneBuffers.pizarra.strokeWeight(18);
  sceneBuffers.pizarra.rect(9, 9, width - 18, height - 18);

  sceneBuffers.ladrillo = createGraphics(width, height);
  drawBrickPattern(sceneBuffers.ladrillo);
}

function drawBrickPattern(g) {
  const brickW = 64, brickH = 28, mortar = 4;
  g.background(58, 30, 24);
  g.noStroke();
  g.fill(46, 24, 19);
  for (let y = 0; y < g.height; y += brickH) {
    const offset = (Math.floor(y / brickH) % 2 === 0) ? 0 : brickW / 2;
    for (let x = -brickW; x < g.width + brickW; x += brickW) {
      g.rect(x + offset + mortar / 2, y + mortar / 2, brickW - mortar, brickH - mortar, 2);
    }
  }
}

function buildSceneButtons() {
  const wrap = select("#scenes");
  Object.keys(scenes).forEach((key) => {
    const btn = createButton(scenes[key].label);
    btn.class("sceneBtn" + (key === currentScene ? " active" : ""));
    btn.parent(wrap);
    btn.mousePressed(() => {
      currentScene = key;
      selectAll(".sceneBtn").forEach(el => el.removeClass("active"));
      btn.addClass("active");
    });
  });
}

function saveArtwork() {
  const composite = createGraphics(width, height);
  if (currentScene === "camara") {
    composite.push();
    composite.translate(width, 0);
    composite.scale(-1, 1);
    composite.image(video, 0, 0, width, height);
    composite.pop();
  } else {
    composite.image(sceneBuffers[currentScene], 0, 0);
  }
  composite.image(wall, 0, 0);
  saveCanvas(composite, "graffiti-gestual", "png");
}

function keyPressed() {
  if (key === " ") {
    togglePause();
    return false; // evita el scroll de página con la barra espaciadora
  }
}

function updateStatusText(rightHand, leftHand) {
  if (!rightHand && !leftHand) {
    select("#statusText").html('Buscando manos<strong>...</strong>');
    return;
  }
  const parts = [];
  if (rightHand) {
    const label = isPaused ? "PAUSADO" : (rightState && rightState.spraying ? "PINTANDO" : "moviendo");
    parts.push(`Der: <strong>${label}</strong>`);
  }
  if (leftHand) parts.push("Izq: <strong>color</strong>");
  select("#statusText").html(parts.join(" · "));
}

/* --------------------------------------------------------
   Rueda cromática flotante controlada con la mano izquierda:
   se centra en la muñeca y el dedo índice, dentro de ese
   círculo, elige matiz (ángulo) y saturación (distancia).
   -------------------------------------------------------- */
const COLOR_WHEEL_RADIUS = COLOR_WHEEL_SIZE / 2;

function updateColorWheelFromHand(hand) {
  const kp = (name) => hand.keypoints.find(p => p.name === name);
  const wrist = kp("wrist");
  const indexTip = kp("index_finger_tip");

  const rawCx = map(wrist.x, 0, video.width, 0, width);
  const rawCy = map(wrist.y, 0, video.height, 0, height);
  const rawPx = map(indexTip.x, 0, video.width, 0, width);
  const rawPy = map(indexTip.y, 0, video.height, 0, height);

  if (!leftState) {
    leftState = { cx: rawCx, cy: rawCy, px: rawPx, py: rawPy };
  }
  leftState.cx = lerp(leftState.cx, rawCx, WHEEL_SMOOTHING);
  leftState.cy = lerp(leftState.cy, rawCy, WHEEL_SMOOTHING);
  leftState.px = lerp(leftState.px, rawPx, WHEEL_SMOOTHING);
  leftState.py = lerp(leftState.py, rawPy, WHEEL_SMOOTHING);

  image(colorWheelGfx, leftState.cx - COLOR_WHEEL_RADIUS, leftState.cy - COLOR_WHEEL_RADIUS, COLOR_WHEEL_SIZE, COLOR_WHEEL_SIZE);

  const dx = leftState.px - leftState.cx;
  const dy = leftState.py - leftState.cy;
  const rawDist = Math.sqrt(dx * dx + dy * dy);
  const clampedDist = Math.min(rawDist, COLOR_WHEEL_RADIUS);
  const angle = Math.atan2(dy, dx);
  const markerX = leftState.cx + Math.cos(angle) * clampedDist;
  const markerY = leftState.cy + Math.sin(angle) * clampedDist;

  let angleDeg = angle * 180 / Math.PI;
  if (angleDeg < 0) angleDeg += 360;
  const [rr, gg, bb] = hsvToRgb(angleDeg, clampedDist / COLOR_WHEEL_RADIUS, 1);
  setCurrentColor(rgbToHex(rr, gg, bb));

  push();
  noFill();
  stroke(255);
  strokeWeight(2);
  circle(markerX, markerY, 12);
  pop();
}

function setCurrentColor(hex) {
  currentColor = hex;
  select("#currentColorSwatch").style("background", hex);
}

function buildBrushes() {
  const wrap = select("#brushes");
  Object.keys(brushes).forEach((key) => {
    const btn = createButton(brushes[key].label);
    btn.class("brushBtn" + (key === currentBrush ? " active" : ""));
    btn.parent(wrap);
    btn.mousePressed(() => {
      currentBrush = key;
      selectAll(".brushBtn").forEach(el => el.removeClass("active"));
      btn.addClass("active");
    });
  });
}

/* --------------------------------------------------------
   Rosa cromática: se calcula una sola vez como p5.Graphics y
   se reutiliza tanto en el panel (canvas 2D, click/touch para
   elegir color) como flotando sobre la mano izquierda.
   -------------------------------------------------------- */
function buildColorWheelGraphic(size) {
  const g = createGraphics(size, size);
  g.loadPixels();
  const cx = size / 2, cy = size / 2, r = size / 2;
  for (let py = 0; py < size; py++) {
    for (let px = 0; px < size; px++) {
      const dx = px - cx, dy = py - cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const idx = 4 * (py * size + px);
      if (d <= r) {
        let angle = Math.atan2(dy, dx) * 180 / Math.PI;
        if (angle < 0) angle += 360;
        const [rr, gg, bb] = hsvToRgb(angle, d / r, 1);
        g.pixels[idx] = rr; g.pixels[idx + 1] = gg; g.pixels[idx + 2] = bb; g.pixels[idx + 3] = 255;
      }
    }
  }
  g.updatePixels();
  return g;
}

function buildColorWheelPanel() {
  const cnv = document.getElementById("colorWheel");
  const ctx = cnv.getContext("2d");
  const w = cnv.width, h = cnv.height, cx = w / 2, cy = h / 2, r = w / 2;
  ctx.drawImage(colorWheelGfx.canvas, 0, 0, w, h);

  function pick(clientX, clientY) {
    const rect = cnv.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const dx = px - cx, dy = py - cy;
    const d = Math.min(Math.sqrt(dx * dx + dy * dy), r);
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    const [rr, gg, bb] = hsvToRgb(angle, d / r, 1);
    setCurrentColor(rgbToHex(rr, gg, bb));
  }

  let dragging = false;
  cnv.addEventListener("mousedown", (e) => { dragging = true; pick(e.clientX, e.clientY); });
  window.addEventListener("mousemove", (e) => { if (dragging) pick(e.clientX, e.clientY); });
  window.addEventListener("mouseup", () => { dragging = false; });
  cnv.addEventListener("touchstart", (e) => { pick(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  cnv.addEventListener("touchmove", (e) => { pick(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
}

function hsvToRgb(h, s, v) {
  const c = v * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = v - c;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildSceneBuffers(); // fondos estáticos, se regeneran gratis
  // el muro NO se redimensiona para no perder lo pintado;
  // si quieres que se adapte al resize, habría que reescalar wall aquí.
}
</script>

</body>
</html>
