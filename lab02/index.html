<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti Gestual</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d0d0c;
    color: #ede9df;
    font-family: "IBM Plex Mono", monospace;
    overflow: hidden;
  }

  #ui {
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  h1 {
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 0.4rem;
  }

  .status {
    font-size: 0.7rem;
    color: #8a8478;
  }
  .status strong { color: #c81e1e; }

  button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #1a1a1a;
    color: #ede9df;
    border: 1px solid #3a3a38;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
  }
  button:hover { border-color: #c81e1e; }

  .section {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding-top: 0.4rem;
    border-top: 1px solid #262624;
  }

  .label {
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8478;
  }

  input[type="range"] {
    width: 180px;
    accent-color: #c81e1e;
  }

  .brushes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .brushBtn {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: #1a1a1a;
    color: #ede9df;
    border: 1px solid #3a3a38;
    padding: 0.35rem 0.6rem;
    cursor: pointer;
  }
  .brushBtn.active { border-color: #c81e1e; color: #c81e1e; }

  .palette {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.1rem;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .swatch.active { border-color: #ede9df; }

  .colorWheelWrap {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.3rem;
  }
  #colorWheel {
    border-radius: 50%;
    cursor: crosshair;
    border: 1px solid #3a3a38;
  }
  .currentColor {
    width: 28px;
    height: 28px;
    border: 1px solid #3a3a38;
    flex-shrink: 0;
  }

  #camPreview {
    position: fixed;
    bottom: 1.2rem;
    right: 1.2rem;
    z-index: 10;
    width: 200px;
    border: 1px solid #3a3a38;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>Graffiti gestual</h1>
  <p class="status" id="statusText">Buscando mano<strong>...</strong></p>

  <div class="section">
    <label class="label">Pincel</label>
    <div class="brushes" id="brushes"></div>
  </div>

  <div class="section">
    <label class="label">Grosor boquilla <span id="nozzleVal">1.0x</span></label>
    <input type="range" id="nozzleSlider" min="0.3" max="2.5" step="0.1" value="1">
  </div>

  <div class="section">
    <label class="label">Color</label>
    <div class="palette" id="palette"></div>
    <div class="colorWheelWrap">
      <canvas id="colorWheel" width="120" height="120"></canvas>
      <div class="currentColor" id="currentColorSwatch"></div>
    </div>
  </div>

  <button id="clearBtn">Limpiar muro</button>
  <button id="saveBtn">Guardar PNG</button>
</div>

<script>
/* ============================================================
   PIPELINE: cámara -> ml5 handPose -> landmarks -> parámetros
   El "muro" (wall) es un graphics buffer que NUNCA se limpia
   entre frames, por eso la pintura se acumula. Cuando conectes
   un sensor de movimiento a futuro, solo reemplazas la función
   getSprayParams() por una que lea ese sensor: el resto del
   sistema (muro, spray, paleta) no cambia.
   ============================================================ */

let handPose;
let video;
let hands = [];
let wall; // buffer persistente = el muro

// gesto: pinch pulgar-índice bajo este umbral = "presionando la boquilla"
const PINCH_THRESHOLD = 45;

const palette = ["#c81e1e", "#ede9df", "#2b6cb0", "#e0a92e", "#111111"];
let currentColor = palette[0];

let nozzleScale = 1; // multiplicador manual sobre el radio calculado por gesto

// último punto pintado, para que "marcador" pueda trazar líneas continuas
let prevX = 0, prevY = 0, isSprayingPrev = false;

const brushes = {
  spray: {
    label: "Spray",
    draw(x, y, radius, hex) {
      const c = color(hex);
      wall.noStroke();
      const density = Math.round(10 * nozzleScale);
      for (let i = 0; i < density; i++) {
        const a = random(TWO_PI);
        const r = random(radius);
        const px = x + cos(a) * r;
        const py = y + sin(a) * r;
        wall.fill(red(c), green(c), blue(c), random(15, 45));
        wall.circle(px, py, random(2, 5) * nozzleScale);
      }
    }
  },
  marcador: {
    label: "Marcador",
    draw(x, y, radius, hex, prev) {
      wall.stroke(color(hex));
      wall.strokeWeight(radius * 0.9);
      wall.strokeCap(ROUND);
      wall.line(prev.x, prev.y, x, y);
    }
  },
  goteo: {
    label: "Goteo",
    draw(x, y, radius, hex, prev) {
      brushes.spray.draw(x, y, radius, hex, prev);
      if (random() < 0.06) {
        const c = color(hex);
        wall.noFill();
        wall.stroke(red(c), green(c), blue(c), 120);
        wall.strokeWeight(random(1, 2.5));
        wall.line(x, y, x + random(-3, 3), y + random(20, 80));
      }
    }
  },
  tiza: {
    label: "Tiza",
    draw(x, y, radius, hex) {
      const c = color(hex);
      wall.noStroke();
      const density = Math.round(18 * nozzleScale);
      for (let i = 0; i < density; i++) {
        const a = random(TWO_PI);
        const r = random(radius);
        const px = x + cos(a) * r;
        const py = y + sin(a) * r;
        wall.fill(red(c), green(c), blue(c), random(30, 70));
        wall.circle(px, py, random(1, 3));
      }
    }
  }
};
let currentBrush = "spray";

function preload() {
  handPose = ml5.handPose({ flipped: true }); // flipped: coincide con el mirror del canvas
}

function setup() {
  const canvas = createCanvas(windowWidth, windowHeight);
  canvas.style("display", "block");

  wall = createGraphics(windowWidth, windowHeight);
  wall.background(20, 20, 18); // color del muro

  video = createCapture(VIDEO);
  video.size(320, 240);
  video.hide();

  handPose.detectStart(video, (results) => { hands = results; });

  buildPalette();
  buildBrushes();
  buildColorWheel();
  select("#clearBtn").mousePressed(() => wall.background(20, 20, 18));
  select("#saveBtn").mousePressed(() => saveCanvas(wall, "graffiti-gestual", "png"));
  select("#nozzleSlider").input(() => {
    nozzleScale = float(select("#nozzleSlider").value());
    select("#nozzleVal").html(nozzleScale.toFixed(1) + "x");
  });
}

function draw() {
  image(wall, 0, 0); // dibuja el muro acumulado

  drawCameraPreview();

  if (hands.length > 0) {
    const params = getSprayParams(hands[0]);
    updateStatus(params);

    if (params.spraying) {
      // si recién empezó el gesto, no traza línea desde el punto anterior
      const prev = isSprayingPrev ? { x: prevX, y: prevY } : { x: params.x, y: params.y };
      brushes[currentBrush].draw(params.x, params.y, params.radius, currentColor, prev);
      prevX = params.x;
      prevY = params.y;
    }
    isSprayingPrev = params.spraying;
    drawNozzleCursor(params);
  } else {
    isSprayingPrev = false;
    select("#statusText").html('Buscando mano<strong>...</strong>');
  }
}

/* --------------------------------------------------------
   Traduce los 21 landmarks de la mano a los parámetros que
   el sistema de spray necesita. Este es el punto exacto que
   reemplazarías si el input pasa a ser un sensor de movimiento.
   -------------------------------------------------------- */
function getSprayParams(hand) {
  const kp = (name) => hand.keypoints.find(p => p.name === name);

  const indexTip = kp("index_finger_tip");
  const thumbTip = kp("thumb_tip");
  const wrist = kp("wrist");
  const middleTip = kp("middle_finger_tip");

  const pinchDist = dist(indexTip.x, indexTip.y, thumbTip.x, thumbTip.y);
  const openness = dist(wrist.x, wrist.y, middleTip.x, middleTip.y);

  // mapea coords del video (320x240) al tamaño real del canvas
  const x = map(indexTip.x, 0, video.width, 0, width);
  const y = map(indexTip.y, 0, video.height, 0, height);
  const radius = map(openness, 60, 200, 8, 55, true) * nozzleScale;

  return {
    x, y, radius,
    spraying: pinchDist < PINCH_THRESHOLD
  };
}

function drawNozzleCursor(params) {
  push();
  noFill();
  stroke(params.spraying ? "#c81e1e" : "#8a8478");
  strokeWeight(1.5);
  circle(params.x, params.y, params.radius * 2);
  pop();
}

function drawCameraPreview() {
  push();
  translate(width - 10, 10);
  const w = 200, h = 150;
  translate(-w, 0);
  scale(-1, 1); // efecto espejo, sin esto se siente invertido al pintar
  image(video, -w, 0, w, h);
  pop();
}

function updateStatus(params) {
  const label = params.spraying ? "PINTANDO" : "moviendo (sin pintar)";
  select("#statusText").html(`Mano detectada — <strong>${label}</strong>`);
}

function buildPalette() {
  const wrap = select("#palette");
  palette.forEach((hex, i) => {
    const sw = createDiv("");
    sw.class("swatch" + (hex === currentColor ? " active" : ""));
    sw.style("background", hex);
    sw.parent(wrap);
    sw.mousePressed(() => {
      selectAll(".swatch").forEach(el => el.removeClass("active"));
      sw.addClass("active");
      setCurrentColor(hex);
    });
  });
  select("#currentColorSwatch").style("background", currentColor);
}

function setCurrentColor(hex) {
  currentColor = hex;
  select("#currentColorSwatch").style("background", hex);
}

function buildBrushes() {
  const wrap = select("#brushes");
  Object.keys(brushes).forEach((key) => {
    const btn = createButton(brushes[key].label);
    btn.class("brushBtn" + (key === currentBrush ? " active" : ""));
    btn.parent(wrap);
    btn.mousePressed(() => {
      currentBrush = key;
      selectAll(".brushBtn").forEach(el => el.removeClass("active"));
      btn.addClass("active");
    });
  });
}

/* --------------------------------------------------------
   Rosa cromática: pinta una rueda de matiz/saturación en un
   <canvas> 2D aparte (no en el canvas p5) y traduce clicks
   en esa rueda a un color hex.
   -------------------------------------------------------- */
function buildColorWheel() {
  const cnv = document.getElementById("colorWheel");
  const ctx = cnv.getContext("2d");
  const w = cnv.width, h = cnv.height;
  const cx = w / 2, cy = h / 2, r = w / 2;

  const img = ctx.createImageData(w, h);
  for (let py = 0; py < h; py++) {
    for (let px = 0; px < w; px++) {
      const dx = px - cx, dy = py - cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const idx = (py * w + px) * 4;
      if (d <= r) {
        let angle = Math.atan2(dy, dx) * 180 / Math.PI;
        if (angle < 0) angle += 360;
        const [rr, gg, bb] = hsvToRgb(angle, d / r, 1);
        img.data[idx] = rr; img.data[idx + 1] = gg; img.data[idx + 2] = bb; img.data[idx + 3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);

  function pick(clientX, clientY) {
    const rect = cnv.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const dx = px - cx, dy = py - cy;
    const d = Math.min(Math.sqrt(dx * dx + dy * dy), r);
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    const [rr, gg, bb] = hsvToRgb(angle, d / r, 1);
    selectAll(".swatch").forEach(el => el.removeClass("active"));
    setCurrentColor(rgbToHex(rr, gg, bb));
  }

  let dragging = false;
  cnv.addEventListener("mousedown", (e) => { dragging = true; pick(e.clientX, e.clientY); });
  window.addEventListener("mousemove", (e) => { if (dragging) pick(e.clientX, e.clientY); });
  window.addEventListener("mouseup", () => { dragging = false; });
  cnv.addEventListener("touchstart", (e) => { pick(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  cnv.addEventListener("touchmove", (e) => { pick(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
}

function hsvToRgb(h, s, v) {
  const c = v * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = v - c;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // el muro NO se redimensiona para no perder lo pintado;
  // si quieres que se adapte al resize, habría que reescalar wall aquí.
}
</script>

</body>
</html>
